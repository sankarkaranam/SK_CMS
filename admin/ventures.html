<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Ventures | Sankar Karanam Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script>
    (function(){
      try {
        var s = JSON.parse(localStorage.getItem('sk_admin_session') || 'null');
        if (!s || Date.now() > s.expiresAt) { window.location.replace('login.html'); }
      } catch(e) { window.location.replace('login.html'); }
    })();
  </script>
</head>
<body class="admin-body">

<div class="admin-sidebar">
  <div class="admin-sidebar-header">
    <a href="../index.html" class="admin-brand" target="_blank">
      <img src="../assets/sankar.jpeg" alt="Sankar" class="admin-brand-avatar">
      <div class="admin-brand-text">
        <span class="admin-brand-name">Sankar Karanam</span>
        <span class="admin-brand-role">Founder CMS</span>
      </div>
    </a>
  </div>
  <nav class="admin-nav">
    <div class="admin-nav-section">
      <div class="admin-nav-section-title">Content</div>
      <a href="index.html" class="admin-nav-link"><span class="admin-nav-icon">📊</span> Dashboard</a>
      <a href="posts.html" class="admin-nav-link"><span class="admin-nav-icon">📝</span> Posts</a>
      <a href="editor.html" class="admin-nav-link"><span class="admin-nav-icon">✏️</span> New Post</a>
      <a href="ideas.html" class="admin-nav-link"><span class="admin-nav-icon">&#128161;</span> Ideas</a>
      <a href="ventures.html" class="admin-nav-link active"><span class="admin-nav-icon">🏢</span> Ventures</a>
      <a href="journey.html" class="admin-nav-link"><span class="admin-nav-icon">🗓️</span> Journey</a>
      <a href="media-library.html" class="admin-nav-link"><span class="admin-nav-icon">🖼️</span> Media Library</a>
    </div>
    <div class="admin-nav-section">
      <div class="admin-nav-section-title">Audience</div>
      <a href="newsletter.html" class="admin-nav-link"><span class="admin-nav-icon">✉️</span> Newsletter</a>
      <a href="contacts.html" class="admin-nav-link"><span class="admin-nav-icon">📩</span> Contact Inbox</a>
    </div>
    <div class="admin-nav-section">
      <div class="admin-nav-section-title">Settings</div>
      <a href="analytics.html" class="admin-nav-link"><span class="admin-nav-icon">📈</span> Analytics</a>
      <a href="seo.html" class="admin-nav-link"><span class="admin-nav-icon">🔍</span> SEO Settings</a>
      <a href="settings.html" class="admin-nav-link"><span class="admin-nav-icon">⚙️</span> Site Settings</a>
    </div>
  </nav>
  <div class="admin-sidebar-footer">
    <button class="admin-logout-btn" id="logout-btn"><span>🚪</span> Sign Out</button>
  </div>
</div>

<div class="admin-main">
  <div class="admin-topbar">
    <div class="admin-topbar-title">Ventures Portfolio Manager</div>
    <div class="admin-topbar-actions">
      <button class="btn btn--primary btn--sm" id="new-venture-btn">+ Add Venture</button>
    </div>
  </div>

  <div class="admin-content">
    <div style="display:grid; grid-template-columns:2fr 1fr; gap:var(--space-8); align-items:start;">
      
      <!-- Ventures List -->
      <div class="admin-table-container">
        <div class="admin-table-header">
          <div class="admin-table-title">Active Ventures</div>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Venture</th>
              <th>Category &amp; Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ventures-tbody"></tbody>
        </table>
      </div>

      <!-- Add/Edit Form -->
      <div class="admin-panel" id="venture-form-panel">
        <div class="admin-panel-header">
          <div class="admin-panel-title" id="form-heading">Add Venture</div>
        </div>
        <div class="admin-panel-body">
          <form id="venture-form" class="form" style="display:flex; flex-direction:column; gap:var(--space-4);">
            <input type="hidden" id="v-id">
            <div class="form-group">
              <label class="form-label" for="v-name">Venture Name <span style="color:var(--rose)">*</span></label>
              <input type="text" id="v-name" class="form-input" placeholder="e.g. OruMind" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="v-tagline">Tagline</label>
              <input type="text" id="v-tagline" class="form-input" placeholder="e.g. Intelligent Product Studio">
            </div>
            <div class="form-group">
              <label class="form-label" for="v-role">Your Role</label>
              <input type="text" id="v-role" class="form-input" placeholder="e.g. Founder & CEO">
            </div>
            <div class="form-group">
              <label class="form-label" for="v-category">Category</label>
              <input type="text" id="v-category" class="form-input" placeholder="e.g. AI & Software">
            </div>
            <div class="form-group">
              <label class="form-label" for="v-url">Website URL</label>
              <input type="url" id="v-url" class="form-input" placeholder="https://…">
            </div>
            <div class="form-group">
              <label class="form-label" for="v-status">Status</label>
              <select id="v-status" class="form-select">
                <option value="active">Active</option>
                <option value="building">Building</option>
                <option value="archived">Archived</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="v-desc">Description</label>
              <textarea id="v-desc" class="form-textarea" rows="3" placeholder="Overview of the company…"></textarea>
            </div>
            <div style="display:flex; gap:var(--space-3);">
              <button type="submit" class="btn btn--primary" style="flex:1;">Save Venture</button>
              <button type="button" class="btn btn--secondary" id="reset-v-form" style="display:none;">Cancel</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../js/articles-data.js"></script>
<script src="../js/cms.js"></script>
<script src="../js/admin/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!AdminAuth.guard()) return;
  document.getElementById('logout-btn').onclick = () => { AdminAuth.logout(); window.location.href = 'login.html'; };

  const tbody = document.getElementById('ventures-tbody');
  const form = document.getElementById('venture-form');
  const cancelBtn = document.getElementById('reset-v-form');
  const formHeading = document.getElementById('form-heading');

  function render() {
    const list = CMS.Ventures.all();
    const esc = CMS.utils.escapeHTML;
    tbody.innerHTML = list.map(v => `
      <tr>
        <td>
          <div style="font-weight:700; color:var(--text-primary);">${esc(v.name)}</div>
          <div style="font-size:11px; color:var(--text-muted);">${esc(v.tagline||'')}</div>
        </td>
        <td>
          <div style="font-size:var(--text-xs); font-weight:600;">${esc(v.role)}</div>
          <div style="font-size:11px; color:var(--text-muted);">${esc(v.category)}</div>
        </td>
        <td><span class="badge badge--${v.status==='active'?'green':v.status==='building'?'amber':'slate'} badge--dot">${esc(v.status)}</span></td>
        <td class="td-actions">
          <button onclick="editV('${esc(v.id)}')" class="action-btn action-btn--edit">Edit</button>
          <a href="${esc(v.url)}" target="_blank" rel="noopener noreferrer" class="action-btn action-btn--view">Visit</a>
          <button onclick="delV('${esc(v.id)}')" class="action-btn action-btn--delete">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  window.editV = (id) => {
    const v = CMS.Ventures.get(id);
    if (!v) return;
    document.getElementById('v-id').value = v.id;
    document.getElementById('v-name').value = v.name;
    document.getElementById('v-tagline').value = v.tagline || '';
    document.getElementById('v-role').value = v.role || '';
    document.getElementById('v-category').value = v.category || '';
    document.getElementById('v-url').value = v.url || '';
    document.getElementById('v-status').value = v.status || 'active';
    document.getElementById('v-desc').value = v.description || '';
    formHeading.textContent = `Edit ${v.name}`;
    cancelBtn.style.display = 'inline-block';
  };

  window.delV = (id) => {
    if (confirm('Delete this venture from your portfolio?')) {
      CMS.Ventures.delete(id);
      render();
    }
  };

  cancelBtn.onclick = () => {
    form.reset();
    document.getElementById('v-id').value = '';
    formHeading.textContent = 'Add Venture';
    cancelBtn.style.display = 'none';
  };

  form.onsubmit = (e) => {
    e.preventDefault();
    const id = document.getElementById('v-id').value;
    const vData = {
      id: id || undefined,
      name: document.getElementById('v-name').value.trim(),
      tagline: document.getElementById('v-tagline').value.trim(),
      role: document.getElementById('v-role').value.trim(),
      category: document.getElementById('v-category').value.trim(),
      url: document.getElementById('v-url').value.trim(),
      status: document.getElementById('v-status').value,
      description: document.getElementById('v-desc').value.trim(),
    };
    CMS.Ventures.save(vData);
    cancelBtn.click();
    render();
  };

  document.getElementById('new-venture-btn').onclick = () => cancelBtn.click();
  render();
});
</script>
</body>
</html>
