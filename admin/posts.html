<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Posts | Sankar Karanam Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script>
    (function(){
      try {
        var s = JSON.parse(localStorage.getItem('sk_admin_session') || 'null');
        if (!s || Date.now() > s.expiresAt) { window.location.replace('login.html'); }
      } catch(e) { window.location.replace('login.html'); }
    })();
  </script>
</head>
<body class="admin-body">

<div class="admin-sidebar">
  <div class="admin-sidebar-header">
    <a href="../index.html" class="admin-brand" target="_blank">
      <img src="../assets/sankar.jpeg" alt="Sankar" class="admin-brand-avatar">
      <div class="admin-brand-text">
        <span class="admin-brand-name">Sankar Karanam</span>
        <span class="admin-brand-role">Founder CMS</span>
      </div>
    </a>
  </div>
  <nav class="admin-nav">
    <div class="admin-nav-section">
      <div class="admin-nav-section-title">Content</div>
      <a href="index.html" class="admin-nav-link"><span class="admin-nav-icon">📊</span> Dashboard</a>
      <a href="posts.html" class="admin-nav-link active"><span class="admin-nav-icon">📝</span> Posts</a>
      <a href="editor.html" class="admin-nav-link"><span class="admin-nav-icon">✏️</span> New Post</a>
      <a href="ideas.html" class="admin-nav-link"><span class="admin-nav-icon">&#128161;</span> Ideas</a>
      <a href="ventures.html" class="admin-nav-link"><span class="admin-nav-icon">🏢</span> Ventures</a>
      <a href="journey.html" class="admin-nav-link"><span class="admin-nav-icon">🗓️</span> Journey</a>
      <a href="media-library.html" class="admin-nav-link"><span class="admin-nav-icon">🖼️</span> Media Library</a>
    </div>
    <div class="admin-nav-section">
      <div class="admin-nav-section-title">Audience</div>
      <a href="newsletter.html" class="admin-nav-link"><span class="admin-nav-icon">✉️</span> Newsletter</a>
      <a href="contacts.html" class="admin-nav-link"><span class="admin-nav-icon">📩</span> Contact Inbox</a>
    </div>
    <div class="admin-nav-section">
      <div class="admin-nav-section-title">Settings</div>
      <a href="analytics.html" class="admin-nav-link"><span class="admin-nav-icon">📈</span> Analytics</a>
      <a href="seo.html" class="admin-nav-link"><span class="admin-nav-icon">🔍</span> SEO Settings</a>
      <a href="settings.html" class="admin-nav-link"><span class="admin-nav-icon">⚙️</span> Site Settings</a>
    </div>
  </nav>
  <div class="admin-sidebar-footer">
    <button class="admin-logout-btn" id="logout-btn"><span>🚪</span> Sign Out</button>
  </div>
</div>

<div class="admin-main">
  <div class="admin-topbar">
    <div class="admin-topbar-title">Posts Manager</div>
    <div class="admin-topbar-actions">
      <a href="editor.html" class="btn btn--primary btn--sm">+ Write New Post</a>
    </div>
  </div>

  <div class="admin-content">
    <div class="admin-table-container">
      <div class="admin-table-header">
        <div style="display:flex; gap:var(--space-3); align-items:center; flex-wrap:wrap;">
          <input type="search" id="posts-search" class="admin-search-input" placeholder="Search posts…">
          <select id="filter-status" class="form-select" style="width:auto; padding:var(--space-2) var(--space-4); font-size:var(--text-xs);">
            <option value="all">All Statuses</option>
            <option value="published">Published</option>
            <option value="draft">Drafts</option>
          </select>
          <select id="filter-cat" class="form-select" style="width:auto; padding:var(--space-2) var(--space-4); font-size:var(--text-xs);">
            <option value="all">All Categories</option>
            <option value="1% Daily Growth">1% Daily Growth</option>
            <option value="AI & Tech">AI &amp; Tech</option>
            <option value="Entrepreneurship">Entrepreneurship</option>
            <option value="Content Creation">Content Creation</option>
            <option value="Cybersecurity">Cybersecurity</option>
          </select>
        </div>
        <div style="font-size:var(--text-xs); color:var(--text-muted);" id="posts-count">0 posts</div>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Status</th>
            <th>Views</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="posts-tbody">
          <!-- Rendered by JS -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="../js/articles-data.js"></script>
<script src="../js/cms.js"></script>
<script src="../js/admin/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!AdminAuth.guard()) return;
  document.getElementById('logout-btn').onclick = () => { AdminAuth.logout(); window.location.href = 'login.html'; };

  const tbody = document.getElementById('posts-tbody');
  const searchInput = document.getElementById('posts-search');
  const filterStatus = document.getElementById('filter-status');
  const filterCat = document.getElementById('filter-cat');
  const countEl = document.getElementById('posts-count');

  async function render() {
    const q = searchInput.value.trim().toLowerCase();
    const st = filterStatus.value;
    const cat = filterCat.value;

    const allPosts = await CMS.Posts.fetchAll();
    let posts = (allPosts || []).filter(p => {
      const matchQ = !q || p.title.toLowerCase().includes(q) || (p.excerpt||'').toLowerCase().includes(q);
      const matchSt = st === 'all' || p.status === st;
      const matchCat = cat === 'all' || p.category === cat;
      return matchQ && matchSt && matchCat;
    });

    countEl.textContent = `${posts.length} post${posts.length !== 1 ? 's' : ''}`;

    if (posts.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:var(--space-8); color:var(--text-muted);">No posts found matching criteria.</td></tr>';
      return;
    }

    const esc = CMS.utils.escapeHTML;
    tbody.innerHTML = posts.map(p => `
      <tr>
        <td class="td-title">
          <a href="editor.html?id=${esc(p.id)}" style="color:var(--text-primary); font-weight:600; text-decoration:none;">${esc(p.title)}</a>
          <div style="font-size:11px; color:var(--text-faint); font-family:var(--font-mono)">/${esc(p.slug)}</div>
        </td>
        <td><span class="badge badge--blue">${esc(p.category)}</span></td>
        <td><span class="badge badge--${p.status==='published'?'green':'amber'} badge--dot">${esc(p.status)}</span></td>
        <td style="font-weight:600; color:var(--cobalt)">${(p.views||0).toLocaleString()}</td>
        <td>${new Date(p.publishedAt||p.updatedAt).toLocaleDateString('en-IN')}</td>
        <td class="td-actions">
          <a href="editor.html?id=${esc(p.id)}" class="action-btn action-btn--edit">Edit</a>
          <a href="../journal/${esc(p.slug)}.html" target="_blank" rel="noopener noreferrer" class="action-btn action-btn--view">View</a>
          <button onclick="deletePost('${esc(p.id)}')" class="action-btn action-btn--delete">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  window.deletePost = async (id) => {
    if (confirm('Are you sure you want to delete this post?')) {
      await CMS.Posts.delete(id);
      await render();
    }
  };

  searchInput.addEventListener('input', render);
  filterStatus.addEventListener('change', render);
  filterCat.addEventListener('change', render);
  render();
});
</script>
</body>
</html>
